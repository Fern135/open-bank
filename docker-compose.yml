# Only web publishes a port. The API, database and cache stay on private
# networks, and web has no route to the database or cache at all.
services:
  web:
    build:
      context: ./web
      args:
        API_INTERNAL_URL: http://server:3001
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  server:
    build: ./server
    environment:
      PORT: "3001"
      DATABASE_URL: postgres://${POSTGRES_USER:-opentally}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-opentally}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?set TOTP_ENCRYPTION_KEY in .env}
      # false only because local Docker serves plain http. Set it to true behind https.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opentally}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-opentally}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8-alpine
    # A cache, so nothing is saved to disk and old keys make way for new ones.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  frontend:
  backend:
    internal: true

volumes:
  db-data:
